services:
  yxz:
    # 默认直接拉取 GitHub 上自动构建好的镜像；要用本地代码构建时执行 docker compose up -d --build
    image: ghcr.io/alumos/yuanxiaozhi_next:latest
    build: .
    ports: ["8080:8080"]
    env_file: .env
    environment:
      YXZ_DATA: /data
    volumes:
      - ./data:/data
      # 课前要改书库或地图时，取消下一行注释，用本机目录覆盖内置内容
      # - ./content:/app/content:ro
    restart: unless-stopped
